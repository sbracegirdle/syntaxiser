[package]
name = "rust-library-fixtures"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["derive"]
resolver = "3"

[dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs", "signal"] }
clap = { version = "=4.5.50", features = ["derive"] }
rand = "=0.9.2"
regex = "=1.12.2"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
log = "=0.4.28"
env_logger = "=0.11.8"
itertools = "=0.14.0"
toml = "=0.9.8"
indexmap = "=2.12.0"
bytes = "=1.10.1"
uuid = { version = "=1.18.1", features = ["v4"] }
chrono = "=0.4.42"
tempfile = "=3.23.0"
futures-util = "=0.3.31"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "=0.8.6"
actix-web = "=4.11.0"
actix-rt = "=2.11.0"
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.6", features = ["trace"] }
recipe-derive = { path = "derive" }
