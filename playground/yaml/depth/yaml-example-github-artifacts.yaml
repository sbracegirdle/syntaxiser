name: Local checks
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: printf 'ok\n' > report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: local-report
          path: report.txt
          if-no-files-found: error
          retention-days: 7
  inspect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-report
      - run: cat report.txt