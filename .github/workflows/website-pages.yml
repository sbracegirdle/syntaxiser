name: Deploy landing page

on:
  push:
    branches: [main, codex/60-github-pages]
    paths:
      - 'website/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage static landing page only
        run: |
          mkdir -p _site
          cp website/index.html website/styles.css _site/
          cp -R website/assets _site/assets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/60-github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
